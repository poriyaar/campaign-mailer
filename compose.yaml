name: campaign-mailer

x-laravel: &laravel
  image: campaign-mailer-php:dev
  build:
    context: .
    dockerfile: Dockerfile
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  working_dir: /app
  entrypoint: []
  environment:
    HOME: /tmp
    COMPOSER_HOME: /tmp/composer
    XDG_CONFIG_HOME: /tmp/config
    XDG_DATA_HOME: /tmp/data
  volumes:
    - ./src:/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *laravel
    command:
      - php
      - artisan
      - octane:frankenphp
      - --host=0.0.0.0
      - --port=8000
      - --workers=2
      - --max-requests=500
    ports:
      - "127.0.0.1:8000:8000"

  horizon:
    <<: *laravel
    command: ["php", "artisan", "horizon"]
    stop_grace_period: 60s

  scheduler:
    <<: *laravel
    command: ["php", "artisan", "schedule:work"]
    stop_grace_period: 60s

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USER}" -d "${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-bookworm
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  postgres_data:
  redis_data:
